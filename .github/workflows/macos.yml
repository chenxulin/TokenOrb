name: Build Token Orb for macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
      - "README.md"
  push:
    branches:
      - master
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run core checks
        run: swift run --package-path macos TokenOrbCoreChecks

      - name: Build macOS app
        run: bash macos/build_macos.sh

      - name: Verify macOS app
        run: |
          test "$(lipo -archs 'macos/dist/Token Orb.app/Contents/MacOS/TokenOrb')" = "x86_64 arm64" || \
            test "$(lipo -archs 'macos/dist/Token Orb.app/Contents/MacOS/TokenOrb')" = "arm64 x86_64"
          codesign --verify --deep --strict "macos/dist/Token Orb.app"
          hdiutil verify macos/dist/TokenOrb-macOS.dmg
          unzip -t macos/dist/TokenOrb-macOS-source.zip
          mount_dir="$RUNNER_TEMP/token-orb-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach macos/dist/TokenOrb-macOS.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          test -d "$mount_dir/Token Orb.app"
          codesign --verify --deep --strict "$mount_dir/Token Orb.app"
          test "$(lipo -archs "$mount_dir/Token Orb.app/Contents/MacOS/TokenOrb")" = "x86_64 arm64" || \
            test "$(lipo -archs "$mount_dir/Token Orb.app/Contents/MacOS/TokenOrb")" = "arm64 x86_64"
          hdiutil detach "$mount_dir"
          trap - EXIT
          cd macos/dist
          shasum -a 256 -c TokenOrb-macOS.sha256

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-macOS
          path: |
            macos/dist/TokenOrb-macOS.dmg
            macos/dist/TokenOrb-macOS-source.zip
            macos/dist/TokenOrb-macOS.sha256
          if-no-files-found: error
