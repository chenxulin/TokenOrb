name: Build and Release Token Orb

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build EXE, MSI, and release archives
        shell: powershell
        run: .\build.ps1 -OutputDirectory .\dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-Windows
          path: dist/TokenOrb.*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run macOS core checks
        run: swift run --package-path macos TokenOrbCoreChecks

      - name: Build macOS app
        run: bash macos/build_macos.sh

      - name: Verify macOS app
        run: |
          test "$(lipo -archs 'macos/dist/Token Orb.app/Contents/MacOS/TokenOrb')" = "x86_64 arm64" || \
            test "$(lipo -archs 'macos/dist/Token Orb.app/Contents/MacOS/TokenOrb')" = "arm64 x86_64"
          codesign --verify --deep --strict "macos/dist/Token Orb.app"
          unzip -t macos/dist/TokenOrb-macOS.zip
          cd macos/dist
          shasum -a 256 -c TokenOrb-macOS.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-macOS
          path: |
            macos/dist/TokenOrb-macOS.zip
            macos/dist/TokenOrb-macOS.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: TokenOrb-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        working-directory: release-assets
        run: |
          sha256sum -c TokenOrb.sha256
          sha256sum -c TokenOrb-macOS.sha256

      - name: Remove existing GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/TokenOrb.exe" \
            "release-assets/TokenOrb.msi" \
            "release-assets/TokenOrb.zip" \
            "release-assets/TokenOrb.source.zip" \
            "release-assets/TokenOrb.md" \
            "release-assets/TokenOrb.sha256" \
            "release-assets/TokenOrb-macOS.zip" \
            "release-assets/TokenOrb-macOS.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Token Orb $GITHUB_REF_NAME"
